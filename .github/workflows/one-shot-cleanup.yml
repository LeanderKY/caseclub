name: One-shot cinematic cleanup

on:
  push:
    branches: [cinematic-redesign]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[boot-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cinematic-redesign
      - name: Move visual boot into index and apply QA fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()
          old = '''<script src="js/i18n.js?v=20260825180138"></script>
          <script src="js/legal.js?v=20260825180138"></script>
          <script src="js/admin.js?v=20260825180138"></script>'''
          new = '''<link rel="stylesheet" href="css/experience.css?v=20260826">
          <script src="js/i18n.js?v=20260825180138"></script>
          <script src="js/legal.js?v=20260826"></script>
          <script src="js/admin.js?v=20260825180138"></script>
          <script type="module" src="js/experience.js?v=20260826"></script>'''
          if old not in html:
              raise SystemExit('Expected script block not found in index.html')
          index.write_text(html.replace(old, new, 1))

          legal = Path('js/legal.js')
          text = legal.read_text()
          marker = '\n/* Progressive visual-experience boot.'
          if marker not in text:
              raise SystemExit('Experience loader marker missing from legal.js')
          legal.write_text(text.split(marker, 1)[0].rstrip() + '\n')

          css = Path('css/experience.css')
          text = css.read_text()
          text = text.replace('opacity:.035;mix-blend-mode:multiply;', 'opacity:.024;mix-blend-mode:normal;')
          text = text.replace('EST. 2026  /  BASEL → EVERYWHERE', 'EST. 2026  /  BASEL, SWITZERLAND')
          text = text.replace(".cc-model-wrap model-viewer{width:min(52vw,680px);height:min(76vh,760px);background:transparent;filter:drop-shadow(0 32px 44px rgba(0,0,0,.36));--poster-color:transparent}", ".cc-model-wrap model-viewer{width:min(52vw,680px);height:min(76vh,760px);background:transparent;filter:drop-shadow(0 32px 44px rgba(0,0,0,.36));--poster-color:transparent;will-change:transform}")
          text = text.replace(".cc-reveal{opacity:1!important;transform:none!important;transition:none!important}.cc-experience *{scroll-behavior:auto!important}.cc-experience .hero-visual .p,.cc-experience .hero-visual .p img{transition:none!important}", ".cc-reveal{opacity:1!important;transform:none!important;transition:none!important}.cc-experience *{scroll-behavior:auto!important}.cc-experience .hero-visual .p,.cc-experience .hero-visual .p img,.cc-chapter{transition:none!important}")
          css.write_text(text)

          js = Path('js/experience.js')
          text = js.read_text()
          text = text.replace("  const bases = [5,-8,10,-4];\n", "")
          text = text.replace("      p.style.rotate = `${(bases[i] + x*(i%2?2:-2)).toFixed(2)}deg`;\n", "")
          text = text.replace("  hero.addEventListener('pointerleave',()=>pieces.forEach(p=>{p.style.translate='';p.style.rotate='';}));", "  hero.addEventListener('pointerleave',()=>pieces.forEach(p=>{p.style.translate='';}));")
          text = text.replace("    fallback.style.opacity = '0';\n    fallback.style.transition = 'opacity .45s ease';", "    fallback.style.transition = 'opacity .45s ease';\n    fallback.style.opacity = '0';")
          text = text.replace('data-chapter="${i}">', 'data-chapter="${i}" aria-hidden="${i===0?\'false\':\'true\'}">')
          text = text.replace("      section.querySelectorAll('.cc-chapter').forEach((el,i)=>el.classList.toggle('is-active',i===chapter));", "      section.querySelectorAll('.cc-chapter').forEach((el,i)=>{\n        const active = i === chapter;\n        el.classList.toggle('is-active', active);\n        el.setAttribute('aria-hidden', active ? 'false' : 'true');\n      });")
          js.write_text(text)
          PY
      - name: Recheck JavaScript after cleanup
        run: |
          node --check js/experience.js
          node --check js/legal.js
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/legal.js css/experience.css js/experience.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Move experience boot into index and finish QA [boot-clean]"
            git push origin HEAD:cinematic-redesign
          fi
